<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fair Share – Memorering</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Lato:wght@300;400&display=swap');

  :root {
    --ink: #2a1f14;
    --ink-mid: #5c4a33;
    --ink-light: #9c8568;
    --accent: #7a4a22;
    --accent-l: #c98b4a;
    --paper: #f5f0e8;
    --paper-dark: #ebe3d0;
    --paper-mid: #ddd3bc;
    --green: #4a7a4a;
    --red: #8b2a2a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    font-family: 'Lato', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 3rem;
  }

  h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--ink); margin-bottom: 0.2rem; }
  .subtitle { font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-l); margin-bottom: 1.6rem; }

  .section-label {
    font-size: 0.65rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-bottom: 0.5rem;
    align-self: flex-start;
    width: 100%;
    max-width: 580px;
  }

  .verse-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 1.4rem;
    width: 100%;
    max-width: 580px;
  }

  .verse-btn {
    padding: 0.4rem 0.9rem;
    border: 1.5px solid var(--paper-mid);
    background: transparent;
    border-radius: 4px;
    font-family: 'Lato', sans-serif;
    font-size: 0.78rem;
    color: var(--ink-light);
    cursor: pointer;
    transition: all 0.2s;
  }

  .verse-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .verse-btn:hover:not(.active) {
    border-color: var(--accent-l);
    color: var(--accent);
  }

  .mode-bar {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 2rem;
    background: var(--paper-dark);
    border-radius: 6px;
    padding: 4px;
    width: 100%;
    max-width: 580px;
  }

  .mode-btn {
    flex: 1;
    padding: 0.45rem 0.6rem;
    border: none;
    background: transparent;
    border-radius: 4px;
    font-family: 'Lato', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    color: var(--ink-light);
    cursor: pointer;
    transition: all 0.2s;
  }

  .mode-btn.active { background: var(--accent); color: #fff; }

  .card-area { width: 100%; max-width: 580px; }

  .progress-bar { height: 3px; background: var(--paper-mid); border-radius: 2px; margin-bottom: 1.5rem; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent-l); border-radius: 2px; transition: width 0.4s ease; }

  .card {
    background: #fff;
    border-radius: 8px;
    padding: 2rem 2rem 1.5rem;
    box-shadow: 0 2px 12px rgba(42,31,20,0.10);
    min-height: 180px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin-bottom: 1.2rem;
  }

  .card-label { font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent-l); margin-bottom: 1rem; }

  .card-line {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--ink);
    line-height: 1.65;
    margin-bottom: 0.25rem;
  }

  .card-line.hidden {
    color: transparent;
    background: var(--paper-mid);
    border-radius: 3px;
    user-select: none;
    cursor: pointer;
    transition: color 0.3s, background 0.3s;
  }

  .card-line.revealed { color: var(--ink); background: transparent; }

  .fill-input {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    border: none;
    border-bottom: 2px solid var(--paper-mid);
    background: transparent;
    color: var(--ink);
    padding: 4px 2px;
    width: 100%;
    outline: none;
    margin-bottom: 0.3rem;
    transition: border-color 0.2s;
  }

  .fill-input:focus { border-color: var(--accent-l); }
  .fill-input.correct { border-color: var(--green); color: var(--green); }
  .fill-input.wrong { border-color: var(--red); }
  .hint-text { font-size: 0.78rem; color: var(--ink-light); font-style: italic; margin-top: 4px; min-height: 1.2em; }

  .btn-row { display: flex; gap: 0.7rem; flex-wrap: wrap; }
  .btn { flex: 1; min-width: 90px; padding: 0.65rem 1rem; border: none; border-radius: 5px; font-family: 'Lato', sans-serif; font-size: 0.82rem; cursor: pointer; transition: transform 0.1s; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--paper-dark); color: var(--ink-mid); }
  .btn-ghost { background: transparent; color: var(--accent-l); border: 1px solid var(--paper-mid); }

  .status { text-align: center; margin-top: 1.4rem; font-size: 0.82rem; color: var(--ink-light); }

  .done-screen { text-align: center; padding: 2rem; }
  .done-screen .big { font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 0.5rem; }
  .done-screen p { color: var(--ink-mid); margin-bottom: 1rem; }
  .score { font-size: 1.3rem; color: var(--accent); margin-bottom: 1.5rem; }

  .divider { height: 1px; background: var(--paper-mid); width: 100%; max-width: 580px; margin: 0.6rem 0 1.4rem; }

  /* ── ACKORD ── */
  .overview { width: 100%; max-width: 560px; margin: -0.6rem 0 1.4rem; background: var(--paper-dark); border: 1px solid var(--paper-mid); border-radius: 6px; padding: 0.6rem 1rem; }
  .overview summary { cursor: pointer; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
  .overview ol { list-style: none; margin-top: 0.6rem; counter-reset: part; }
  .overview li { display: flex; justify-content: space-between; gap: 1rem; padding: 0.3rem 0; border-top: 1px dashed var(--paper-mid); font-size: 0.85rem; color: var(--ink-mid); }
  .overview li b { font-family: 'Courier New', monospace; font-weight: 700; color: var(--ink); text-align: right; }
  .chord-row { width: 100%; max-width: 560px; display: flex; align-items: flex-start; gap: 0.6rem; margin-bottom: 0.6rem; }
  .chord-strip { flex: 1; background: var(--ink); color: var(--paper); border-radius: 6px; padding: 0.55rem 0.9rem; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.3rem 0.8rem; }
  .chord-part { font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-l); }
  .chord-names { font-family: 'Courier New', monospace; font-weight: 700; font-size: 1rem; }
  .chord-next { width: 100%; font-size: 0.75rem; color: var(--paper-mid); }
  .chord-toggle { background: none; border: 1px solid var(--paper-mid); border-radius: 6px; padding: 0.5rem 0.7rem; font-size: 0.7rem; color: var(--ink-light); cursor: pointer; white-space: nowrap; }
</style>
</head>
<body>

<h1>Fair Share</h1>
<p class="subtitle">Memorering · med ackord</p>

<details class="overview">
  <summary>Låtens form &amp; ackord</summary>
  <ol id="chordOverview"></ol>
</details>

<p class="section-label">Välj avsnitt</p>
<div class="verse-bar" id="verseBar"></div>

<div class="divider"></div>

<p class="section-label">Läge</p>
<div class="mode-bar">
  <button class="mode-btn active" onclick="setMode('reveal')">Avslöja rad</button>
  <button class="mode-btn" onclick="setMode('fillin')">Fyll i texten</button>
  <button class="mode-btn" onclick="setMode('blind')">Helt blind</button>
</div>

<div class="chord-row">
  <div class="chord-strip" id="chordStrip"></div>
  <button class="chord-toggle" id="chordToggle" onclick="toggleChords()">Dölj ackord</button>
</div>
<div class="card-area" id="app"></div>

<script>
// ── LÅTENS DELAR ──────────────────────────────────────────────
// Varje del har ett namn, ackord och textrader. Delar utan text (t.ex. solo)
// visas bara i ackordöversikten.
const PARTS = {
  V1: { label: "Vers 1", chords: "G", lines: ["Won't you give me, won't you give me some peace, some peace of mind"] },
  B1: { label: "Brygga 1", chords: "D · C · G", lines: ["'Cause I fake it hard every day", "to make it shine for everyone to see"] },
  R1: { label: "Refräng 1", chords: "Em · G", lines: ["And I have had my fair share", "of troubles down the line", "So I set myself up", "for sunshine on my mind"] },
  V2: { label: "Vers 2", chords: "G", lines: ["So come and give me, won't you give me some peace, some peace of mind"] },
  B2: { label: "Brygga 2", chords: "D · C · G", lines: ["'Cause I temper my walk", "down the street", "to make it with swag", "for everyone to see"] },
  R2: { label: "Refräng 2", chords: "Em · G", lines: ["I call on you here to be the sunshine of my days", "We'll make it, I swear, if we let it be our way (Ok)"] },
  V3: { label: "Vers 3", chords: "G", lines: ["Won't you give me, won't you give me some peace, some peace of mind"] },
  B3: { label: "Brygga 3", chords: "D · C · G", lines: ["I walk on by", "with a bigger smile", "to make you feel", "what's behind those eyes"] },
  R3: { label: "Refräng 3", chords: "Em · G", lines: ["I give you it all", "just to celebrate our time", "Just set it to stay", "and we'll make it all"] }
};

// Låtens form från början till slut
const FORM = ["V1", "B1", "R1", "V2", "B2", "R2", "V3", "B3", "R3"];

// Knapparna under "Välj avsnitt"
const SECTIONS = [
  { label: "Del 1", parts: ["V1", "B1", "R1"] },
  { label: "Del 2", parts: ["V2", "B2", "R2"] },
  { label: "Del 3", parts: ["V3", "B3", "R3"] },
  { label: "Alla bryggor", parts: ["B1", "B2", "B3"] },
  { label: "Alla refränger", parts: ["R1", "R2", "R3"] },
  { label: "Hela låten", parts: FORM }
];
// ──────────────────────────────────────────────────────────────

const expand = (parts) => parts.flatMap(k => PARTS[k].lines.map(t => ({ t, k })));

buildOverview();
let mode = 'reveal';
let currentSection = 0;
let current = 0;
let score = 0;
let total = 0;

const verseBar = document.getElementById('verseBar');
SECTIONS.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = 'verse-btn' + (i === 0 ? ' active' : '');
  btn.textContent = s.label;
  btn.onclick = () => selectSection(i);
  verseBar.appendChild(btn);
});

function selectSection(i) {
  currentSection = i;
  document.querySelectorAll('.verse-btn').forEach((b, j) => b.classList.toggle('active', j === i));
  restart();
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach((b, i) => {
    b.classList.toggle('active', ['reveal','fillin','blind'][i] === m);
  });
  restart();
}

function restart() {
  current = 0;
  score = 0;
  total = 0;
  render();
}

function getLines() { return expand(SECTIONS[currentSection].parts).map(x => x.t); }
function getLabel() {
  const items = expand(SECTIONS[currentSection].parts);
  const item = items[Math.min(current, items.length - 1)];
  const sec = SECTIONS[currentSection].label;
  return item && PARTS[item.k].label !== sec ? `${sec} · ${PARTS[item.k].label}` : sec;
}

// Visar ackorden för den del man är i just nu
function updateChords() {
  const strip = document.getElementById('chordStrip');
  if (!strip) return;
  const items = expand(SECTIONS[currentSection].parts);
  const item = items[Math.min(current, items.length - 1)];
  if (!item || !showChords) { strip.style.display = 'none'; return; }
  const part = PARTS[item.k];
  // Visa solo/mellanspel som kommer direkt efter delen, så man minns det
  const formIdx = SECTIONS[currentSection].parts === FORM ? nthFormIndex(items, Math.min(current, items.length - 1)) : -1;
  const next = formIdx >= 0 ? FORM[formIdx + 1] : null;
  const extra = next && PARTS[next].lines.length === 0 && item === lastOfPart(items, current)
    ? `<div class="chord-next">Sedan: ${PARTS[next].label} — ${PARTS[next].chords}</div>` : '';
  strip.style.display = '';
  strip.innerHTML = `<span class="chord-part">${part.label}</span><span class="chord-names">${part.chords}</span>${extra}`;
}
function nthFormIndex(items, i) {
  // vilken position i FORM som rad i tillhör
  let count = 0;
  for (let f = 0; f < FORM.length; f++) {
    count += PARTS[FORM[f]].lines.length;
    if (i < count) return f;
  }
  return FORM.length - 1;
}
function lastOfPart(items, i) {
  const f = nthFormIndex(items, i);
  let count = 0;
  for (let x = 0; x <= f; x++) count += PARTS[FORM[x]].lines.length;
  return items[count - 1];
}

let showChords = true;
function toggleChords() {
  showChords = !showChords;
  document.getElementById('chordToggle').textContent = showChords ? 'Dölj ackord' : 'Visa ackord';
  updateChords();
}

function buildOverview() {
  const el = document.getElementById('chordOverview');
  if (!el) return;
  el.innerHTML = FORM.map(k => `<li><span>${PARTS[k].label}</span><b>${PARTS[k].chords}</b></li>`).join('');
}

function render() {
  updateChords();
  const app = document.getElementById('app');
  const lines = getLines();
  if (current >= lines.length) { renderDone(app); return; }
  const pct = (current / lines.length) * 100;
  if (mode === 'reveal') renderReveal(app, pct, lines);
  else if (mode === 'fillin') renderFillin(app, pct, lines);
  else renderBlind(app, pct, lines);
}

function renderReveal(app, pct, lines) {
  app.innerHTML = `
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="card-label">${getLabel()} · Rad ${current + 1} av ${lines.length}</div>
      ${lines.map((l, i) => {
        if (i < current) return `<div class="card-line">${l}</div>`;
        if (i === current) return `<div class="card-line hidden" id="currentLine" onclick="revealLine()">${l}</div>`;
        return `<div class="card-line" style="color:var(--paper-mid)">${l}</div>`;
      }).join('')}
    </div>
    <p style="font-size:0.78rem;color:var(--ink-light);text-align:center;margin-bottom:0.8rem">
      Tryck på raden — försök minnas den innan du avslöjar!
    </p>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="restart()">Börja om</button>
      <button class="btn btn-primary" id="nextBtn" onclick="next()" style="display:none">Nästa rad →</button>
    </div>
    <div class="status">Rad ${current + 1} av ${lines.length}</div>
  `;
}

function revealLine() {
  document.getElementById('currentLine').classList.remove('hidden');
  document.getElementById('currentLine').classList.add('revealed');
  document.getElementById('nextBtn').style.display = 'block';
}

function renderFillin(app, pct, lines) {
  app.innerHTML = `
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="card-label">${getLabel()} · Rad ${current + 1} av ${lines.length} — fyll i texten</div>
      ${lines.slice(0, current).map(l => `<div class="card-line">${l}</div>`).join('')}
      <input class="fill-input" id="fillInput" placeholder="Skriv raden här…" autocomplete="off" spellcheck="false"
        onkeydown="if(event.key==='Enter') checkFill()">
      <div class="hint-text" id="hintText"></div>
      ${lines.slice(current+1).map(l => `<div class="card-line" style="color:var(--paper-mid)">${l}</div>`).join('')}
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="showHint()">Ledtråd</button>
      <button class="btn btn-secondary" onclick="restart()">Börja om</button>
      <button class="btn btn-primary" onclick="checkFill()">Kolla →</button>
    </div>
    <div class="status">Rätt: ${score} / ${total}</div>
  `;
  document.getElementById('fillInput').focus();
}

function checkFill() {
  const input = document.getElementById('fillInput');
  const hint = document.getElementById('hintText');
  const lines = getLines();
  const val = input.value.trim().toLowerCase().replace(/[^a-zåäö0-9\s]/g,'');
  const correct = lines[current].toLowerCase().replace(/[^a-zåäö0-9\s]/g,'');
  total++;
  const vWords = val.split(' ').filter(Boolean);
  const cWords = correct.split(' ').filter(Boolean);
  const matches = vWords.filter(w => cWords.includes(w)).length;
  const ok = matches >= Math.ceil(cWords.length * 0.65);
  if (ok) {
    score++;
    input.classList.add('correct');
    hint.textContent = '✓ Rätt!';
    hint.style.color = 'var(--green)';
    setTimeout(() => next(), 900);
  } else {
    input.classList.add('wrong');
    hint.innerHTML = `Rätt svar: <em>${lines[current]}</em>`;
    hint.style.color = 'var(--red)';
    setTimeout(() => next(), 2400);
  }
}

function showHint() {
  const words = getLines()[current].split(' ');
  document.getElementById('hintText').textContent = words.slice(0, 3).join(' ') + '…';
  document.getElementById('hintText').style.color = 'var(--accent-l)';
}

function renderBlind(app, pct, lines) {
  app.innerHTML = `
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card" style="align-items:center;text-align:center">
      <div class="card-label" style="text-align:center">${getLabel()} · Rad ${current + 1} av ${lines.length}</div>
      <div style="font-size:3rem;color:var(--paper-mid);margin:1rem 0">?</div>
      <p style="color:var(--ink-light);font-size:0.85rem;font-style:italic">
        Sjung eller säg raden — tryck sen för att se om du hade rätt
      </p>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="restart()">Börja om</button>
      <button class="btn btn-primary" onclick="revealBlind()">Visa raden</button>
    </div>
  `;
}

function revealBlind() {
  const app = document.getElementById('app');
  const lines = getLines();
  const pct = (current / lines.length) * 100;
  app.innerHTML = `
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card" style="align-items:center;text-align:center">
      <div class="card-label">${getLabel()} · Rad ${current + 1} av ${lines.length}</div>
      <div class="card-line" style="text-align:center">${lines[current]}</div>
    </div>
    <p style="font-size:0.8rem;color:var(--ink-light);text-align:center;margin-bottom:0.8rem">Hade du rätt?</p>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="restart()">Börja om</button>
      <button class="btn" style="background:var(--red);color:#fff;flex:1" onclick="next()">Nej ✗</button>
      <button class="btn" style="background:var(--green);color:#fff;flex:1" onclick="scoreAndNext()">Ja ✓</button>
    </div>
    <div class="status">Rätt: ${score} / ${total}</div>
  `;
}

function scoreAndNext() { score++; total++; next(); }
function next() { current++; render(); }

function renderDone(app) {
  const lines = getLines();
  app.innerHTML = `
    <div class="card done-screen">
      <div class="big">🎸</div>
      <p>${getLabel()} — klar!</p>
      ${mode !== 'reveal' ? `<div class="score">${score} / ${lines.length} rätt${score === lines.length ? ' 🎉' : ''}</div>` : ''}
      <div class="btn-row" style="justify-content:center;gap:0.7rem">
        <button class="btn btn-secondary" onclick="restart()">Kör igen</button>
        ${currentSection < SECTIONS.length - 2
          ? `<button class="btn btn-primary" onclick="selectSection(${currentSection + 1})">Nästa avsnitt →</button>`
          : ''}
      </div>
    </div>
  `;
}

render();
</script>
</body>
</html>
